<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Airline Copilot test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .msg { padding: .5rem .75rem; margin: .5rem 0; border-radius: 8px; white-space: pre-wrap; }
    .you { background: #e8f0fe; }
    .bot { background: #f1f3f4; }
    form { display: flex; gap: .5rem; margin-top: 1rem; }
    input { flex: 1; padding: .5rem; }
  </style>
</head>
<body>
  <h2>Airline Copilot</h2>
  <div id="log"></div>
  <form id="f">
    <input id="q" placeholder="Ask something..." autocomplete="off" />
    <button>Send</button>
  </form>

<script>
  const history = [];
  const log = document.getElementById("log");

  function add(cls, text) {
    const el = document.createElement("div");
    el.className = "msg " + cls;
    el.textContent = text;
    log.appendChild(el);
    return el;
  }

  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = document.getElementById("q");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";

    history.push({ role: "user", content: text });
    add("you", text);
    const botEl = add("bot", "");
    let reply = "";

    try {
      const res = await fetch("/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      if (!res.ok) throw new Error("HTTP " + res.status);

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const parts = buf.split("\n\n");
        buf = parts.pop(); // keep any incomplete event for the next read
        for (const p of parts) {
          if (!p.startsWith("data: ")) continue;
          const ev = JSON.parse(p.slice(6));
          if (ev.token) { reply += ev.token; botEl.textContent = reply; }
          if (ev.error) { botEl.textContent += "\n[error: " + ev.error + "]"; }
        }
      }
    } catch (err) {
      botEl.textContent = "[request failed: " + err.message + "]";
    }

    if (reply) history.push({ role: "assistant", content: reply });
    else history.pop(); // failed turn: drop the user message so history stays valid
  });
</script>
</body>
</html>
